name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --parallel --shard=${{ matrix.shard }}/2

  # Rails runs its suite against every adapter it supports, because an adapter
  # branch that never executes is a branch nobody has checked. The SQLite legs
  # above cover the whole framework; these cover the ORM against real servers.
  adapters:
    name: orm (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: postgres
            url: postgres://altair:altair@localhost:5432/altair_test
          - adapter: mysql
            url: mysql://altair:altair@localhost:3306/altair_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: altair
          POSTGRES_PASSWORD: altair
          POSTGRES_DB: altair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: altair
          MYSQL_USER: altair
          MYSQL_PASSWORD: altair
          MYSQL_DATABASE: altair_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ualtair -paltair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Not --parallel: these legs share one database, and a test file that
      # drops another file's tables mid-run is a failure nobody can reproduce.
      - name: Run the ORM suite
        run: bun test packages/orm packages/testing
        env:
          ALTAIR_TEST_DATABASE_URL: ${{ matrix.url }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Pinned via devDependencies rather than @latest, so a tool release never
      # turns an unrelated pull request red.
      - name: Lint
        run: bunx oxlint --deny-warnings

      - name: Check formatting
        run: bunx oxfmt --check .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun test --coverage --coverage-reporter=lcov

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  fixtures:
    name: fixtures match Rails
    runs-on: ubuntu-latest
    # Advisory, not blocking: Rails' own fixtures change upstream, and that should
    # tell us to re-port rather than fail an unrelated pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Our test data is generated from Rails' own fixtures. Regenerating against
      # a fresh clone proves the committed copies were not hand-edited to pass.
      - name: Clone Rails
        run: git clone --depth 1 https://github.com/rails/rails ../research/rails

      - name: Regenerate fixtures
        run: bun run port:fixtures

      - name: Fail if fixtures drifted
        run: |
          if ! git diff --quiet; then
            echo "::error::Committed fixtures differ from those generated from rails/rails@main."
            echo "Run 'bun run port:fixtures' and review the diff."
            git diff --stat
            exit 1
          fi
          echo "Fixtures match rails/rails@main."
